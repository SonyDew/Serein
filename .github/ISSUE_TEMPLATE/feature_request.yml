name: Suggest an improvement
description: New features, usability improvements and translation ideas are welcome.
title: "[Idea] "
body:
  - type: textarea
    id: task
    attributes:
      label: What would you like to do?
      description: No technical knowledge needed. Describe the task in your own words.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could Serein make it easier?
    validations:
      required: true
